name: homeguru
description: "HomeGuru — Your personalized learning companion."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  phosphor_flutter: ^2.1.0
  http: ^1.2.0
  youtube_player_flutter: ^9.1.1
  file_picker: ^8.0.0
  image_picker: ^1.1.2
  flutter_inappwebview: ^6.0.0
  razorpay_flutter: ^1.3.7
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.4
  open_filex: ^4.5.0
  flutter_quill: ^11.5.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "hgicon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/mascot_walk.png
    - assets/note.png
    - assets/teach.png
    - assets/chill.png
    - assets/profileHeader.png
    - assets/rotate.png
    - assets/open.png
    - assets/hoot.png

  fonts:
    - family: Matter
      fonts:
        - asset: assets/fonts/Matter-TRIAL-Light.otf
          weight: 300
        - asset: assets/fonts/Matter-TRIAL-Regular.otf
          weight: 400
        - asset: assets/fonts/Matter-TRIAL-Medium.otf
          weight: 500
        - asset: assets/fonts/Matter-TRIAL-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Matter-TRIAL-Bold.otf
          weight: 700

